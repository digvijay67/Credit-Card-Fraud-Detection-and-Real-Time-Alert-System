services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-0.5}
      MODEL_VERSION: ${MODEL_VERSION:-demo-v3}
      MODEL_DIR: /app/models
      DEMO_MODE: ${DEMO_MODE:-true}
    volumes:
      - ./backend/models:/app/models
      - ./backend/data:/app/data:ro
    command: ["sh", "-c", "set -e; if [ \"$$DEMO_MODE\" = \"true\" ] && { [ ! -f /app/models/xgboost.joblib ] || [ ! -f /app/models/random_forest.joblib ] || [ ! -f /app/models/logistic_regression.joblib ] || [ ! -f /app/models/metrics.json ]; }; then python -m app.train --demo-data; fi; flask --app app.wsgi:app init-db; exec gunicorn --bind 0.0.0.0:5000 --workers 2 --access-logfile - 'app:create_app()'"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy
    networks: [private]

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [private]

  https-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks: [private, edge]

volumes:
  mysql_data:

networks:
  private:
    internal: true
  edge:
